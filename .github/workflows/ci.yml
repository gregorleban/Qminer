name: CI

on:
  push:
    branches: [production, staging-2026-07]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Build + unit tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libre2-dev uuid-dev \
            python3 python-is-python3
          # node is preinstalled on ubuntu-latest runners; node-gyp comes via npm

      # binding.gyp's static-library targets produce build/Release/glib.a and
      # build/Release/qminer.a - the only artefacts the C++ tests link against.
      # Build those targets directly instead of `npm install`: that would also build
      # the `qm` node addon (src/nodejs), which the tests do not use and which does
      # not compile against current node/v8 headers.
      - name: Build qminer static libraries
        run: |
          npm install -g node-gyp
          node-gyp configure
          make -C build glib qminer -j"$(nproc)"
          ls -l build/Release/glib.a build/Release/qminer.a

      - name: Configure tests (CMake + FetchContent GoogleTest)
        run: >
          cmake -S test/cpp -B test/cpp/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQMINER_LIB_DIR=${{ github.workspace }}/build/Release

      - name: Build tests
        run: cmake --build test/cpp/build

      # ctest runs the suite as a single process from the repository root (see the
      # comment in test/cpp/CMakeLists.txt); the gtest XML lands in the build dir
      - name: Run tests
        run: ctest --test-dir test/cpp/build --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qminer-test-results
          path: test/cpp/build/test-results.xml
